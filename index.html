<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Karteikarten">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Karteikarten mit Leitner-System für das Studienkolleg (T-Kurs).">
  <title>Karteikarten</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Tema elegido antes del primer pintado, para que no parpadee.
    try { const t = localStorage.getItem('karteikarten.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <script defer src="vendor/katex/katex.min.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <span class="topbar-title" aria-hidden="true">Lernen</span>
      <button class="icon-btn" id="menuBtn" aria-label="Weitere Optionen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <header class="hero">
      <p class="date" id="today"></p>
      <h1 class="title" id="title">Lernen</h1>
      <button class="summary" id="summary" aria-label="Statistik öffnen">
        <div class="ring" aria-hidden="true">
          <svg viewBox="0 0 44 44"><circle class="ring-track" cx="22" cy="22" r="19"/><circle class="ring-fill" id="ringFill" cx="22" cy="22" r="19"/></svg>
          <span class="ring-pct" id="ringPct">0%</span>
        </div>
        <div class="summary-text">
          <strong id="progressText"></strong>
          <span id="progressSub"></span>
        </div>
      </button>
    </header>

    <div class="section-head">
      <h2 class="section-title">Stapel <span class="count" id="deckCount"></span></h2>
      <button class="text-btn" id="newDeckBtn">Neuer Stapel</button>
    </div>
    <ul class="list" id="deckList"></ul>
    <div class="empty" id="empty" hidden></div>
  </main>

  <div class="composer" id="composer">
    <div class="composer-row">
      <button type="button" class="round-btn" id="statsBtn" aria-label="Statistik">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-5"/></svg>
      </button>
      <button type="button" class="study-btn" id="studyBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>
        <span id="studyLabel">Lernen</span>
      </button>
      <button type="button" class="round-btn" id="addCardBtn" aria-label="Neue Karte">
        <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <!-- Repaso a pantalla completa -->
  <section class="review" id="review" hidden aria-label="Wiederholung">
    <div class="review-top">
      <button class="icon-btn" id="reviewClose" aria-label="Beenden">
        <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="review-meta">
        <span id="reviewDeck"></span>
        <strong id="reviewCount"></strong>
      </div>
      <button class="icon-btn" id="reviewEdit" aria-label="Karte bearbeiten">
        <svg class="stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg>
      </button>
    </div>
    <div class="review-bar"><span id="reviewBar"></span></div>
    <div class="stage" id="stage"></div>
    <div class="review-actions" id="reviewActions"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button id="toastUndo">Rückgängig</button>
  </div>

  <div class="sheet-layer" id="sheetLayer" hidden>
    <div class="backdrop" id="backdrop"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <input type="file" id="importInput" accept="application/json,.json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
